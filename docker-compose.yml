version: "2"

services:
  goof:
    build: .
    container_name: kaustubh-sit753-container
    environment:
      - DOCKER=1
      - NODE_OPTIONS=--openssl-legacy-provider
    ports:
      - "3001:3001"
      - "9229:9229"
    links:
      - goof-mongo
      - goof-mysql
    depends_on:
      - goof-mongo
      - goof-mysql

  goof-mongo:
    container_name: goof-mongo
    image: mongo:3
    ports:
      - "27017:27017"

  goof-mysql:
    container_name: goof-mysql
    image: mysql:5
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: acme
    ports:
      - "3307:3306"